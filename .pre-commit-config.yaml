repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix .
        entry: uv run ruff check --fix .
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format .
        entry: uv run ruff format .
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy strict
        entry: uv run mypy .
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true

      - id: conventional-commit
        name: conventional commit message
        entry: uv run python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
