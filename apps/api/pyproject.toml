[project]
name = "watad-api"
version = "0.1.0"
description = "AridOS RFQ Copilot API — FastAPI + LangGraph backend (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # Settings / validation
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Agent orchestration
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "anthropic>=0.40",
    # Persistence
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "redis[hiredis]>=5.2",
    # Observability
    "langfuse>=2.55",
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # Data / utilities
    "pandas>=2.2",
    "rapidfuzz>=3.10",
    "python-dateutil>=2.9",
]

[project.scripts]
watad = "watad.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watad"]
